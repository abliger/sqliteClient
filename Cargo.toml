[workspace]
members = ["apps/desktop/src-tauri", "packages/shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["SQLite Client Team"]
license = "MIT"

[workspace.dependencies]
# 核心依赖
tauri = { version = "2.0", features = [] }
tauri-build = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }

# SQLite
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 工具
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"
parking_lot = "0.12"

# 导出
csv = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
